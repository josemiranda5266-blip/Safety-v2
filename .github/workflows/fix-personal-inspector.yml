name: Fix personal Inspector IA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch frontend personal AI transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/db.ts')
          s = p.read_text()
          old = """  public async callAiApi<T>(endpoint: string, payload: any, customTimeoutMs = 90000): Promise<T> {\n    const headers = await this.getAuthHeaders();\n    const url = buildApiUrl(endpoint);"""
          new = """  public async callAiApi<T>(endpoint: string, payload: any, customTimeoutMs = 90000): Promise<T> {\n    // Safety-v2 is a personal application: AI requests must not depend on Firebase Auth.\n    // The backend explicitly accepts unauthenticated requests in personal mode.\n    const isPersonalAiEndpoint = endpoint.includes('/inspector-ai-analyze') || endpoint.includes('/analyze-image');\n    const headers = isPersonalAiEndpoint ? {} : await this.getAuthHeaders();\n    const url = buildApiUrl(endpoint);"""
          if old not in s:
              raise SystemExit('Expected callAiApi block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/db.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make personal Inspector IA requests auth-free"
          git push
